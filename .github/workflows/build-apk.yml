name: APK firmado

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clave de firma
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            exit 0
          fi
          gh release create firma --title "Clave de firma" --notes "Guarda este archivo: firma las futuras actualizaciones de tu app." 2>/dev/null || true
          gh release download firma -p release.jks -D keystore --clobber 2>/dev/null || true
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v -keystore keystore/release.jks -alias tvtool -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=TV Forge, O=TV Forge, C=ES"
            gh release upload firma keystore/release.jks --clobber
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/cancha-tv.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: APK firmado
          body: APK firmado y listo para instalar en Android TV.
          files: app/build/outputs/apk/release/cancha-tv.apk
